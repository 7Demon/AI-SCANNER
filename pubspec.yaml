name: aiscann
description: "Aplikasi Android pembanding hasil printing karung sample vs aktual menggunakan Google Gemini Vision AI"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image: ^4.3.0
  pdf: ^3.12.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  archive: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
